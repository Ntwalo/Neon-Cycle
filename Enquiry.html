<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Enquiry form for Neon Cycle — book repairs or ask about products and services.">
  <title>Neon Cycle — Enquiry</title>
  <link rel="stylesheet" href="css/enquiry.css">
</head>
<body>

  <a class="skip-link" href="#main">Skip to main content</a>

  <header role="banner" class="site-header container">
    <div class="header-inner">
      <a class="logo" href="Home.html" aria-label="Neon Cycle home">
        <img src="images/logo.jpg" alt="Neon Cycle logo" />
      </a>

      <nav role="navigation" aria-label="Primary" class="main-nav">
        <ul class="nav-links">
          <li><a href="Home.html">Home</a></li>
          <li><a href="About.html">About</a></li>
          <li><a href="Product.html">Products</a></li>
          <li><a href="Enquiry.html" aria-current="page">Enquiry</a></li>
          <li><a href="Contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" role="main" class="container">
    <section class="enquiry-hero content-section" aria-labelledby="enquiry-heading">
      <h1 id="enquiry-heading">Enquiry Form</h1>
      <p class="lead">For bookings please fill the form below. Fields marked with an asterisk are required.</p>
    </section>

    <section class="content-section">
      <h2 class="visually-hidden" id="form-heading">Booking and Enquiry Form</h2>

      <form id="enquiryForm" class="custom-form" novalidate>
        <div class="form-row">
          <label for="name">Name <span class="required" aria-hidden="true">*</span></label>
          <input id="name" name="name" type="text" required minlength="2" placeholder="Enter your full name" />
        </div>

        <div class="form-row">
          <label for="email">Email <span class="required" aria-hidden="true">*</span></label>
          <input id="email" name="email" type="email" required placeholder="you@example.com" />
        </div>

        <div class="form-row">
          <label for="date">Preferred Date</label>
          <input id="date" name="date" type="date" />
        </div>

        <div class="form-row">
          <label for="phone">Phone number <span class="required" aria-hidden="true">*</span></label>
          <input id="phone" name="phone" type="tel" required pattern="^\d{10}$" placeholder="0797649920" aria-describedby="phoneHelp" />
          <small id="phoneHelp">Enter 10 digits, e.g., 0797649920</small>
        </div>

        <div class="form-row">
          <label for="service">Service type</label>
          <select id="service" name="service">
            <option value="">-- Select service --</option>
            <option value="repair">Repair</option>
            <option value="product-enquiry">Product enquiry</option>
            <option value="maintenance">Maintenance</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-row full">
          <label for="details">Details</label>
          <textarea id="details" name="details" rows="5" placeholder="Describe the service or enquiry"></textarea>
        </div>

        <div class="form-row full actions">
          <button type="submit" class="btn">Submit</button>
          <button type="reset" class="btn ghost">Reset</button>
        </div>

        <div id="enquiryStatus" role="status" aria-live="polite" class="form-status" hidden></div>
      </form>
    </section>
  </main>

  <footer role="contentinfo" class="site-footer container">
    <p>&copy; ST10472961 Neon Cycle</p>
  </footer>

</body>
</html>
